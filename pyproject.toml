[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jira-ingestion"
version = "0.1.0"
description = "Jira ticket ingestion pipeline — extracts, chunks, embeds, and indexes idea cards"
requires-python = ">=3.10"
dependencies = [
    # Async HTTP
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",
    # Jira API
    "jira>=3.6.0",
    # Document extraction (MarkItDown pulls in pptx/pdf/docx support)
    "markitdown[all]>=0.0.1",
    # PDF triage peek (optional but recommended)
    "PyMuPDF>=1.23.0",
    # Text processing
    "langdetect>=1.0.9",
    # LLM + Embeddings
    "openai>=1.30.0",
    # Vector store — LangGraph ecosystem
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
]

[project.optional-dependencies]
# Parquet output support
parquet = ["pyarrow>=15.0.0"]
# Persistent vector store backends (pick one)
chroma  = ["langchain-chroma>=0.1.0"]
faiss   = ["faiss-cpu>=1.8.0"]
# Everything
all = ["pyarrow>=15.0.0", "langchain-chroma>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "data/entity_dicts/",
]

# ── For IDP-VALUE-STREAMS: add this block to the parent pyproject.toml ────────
